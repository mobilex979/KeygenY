name: Build KeyGen APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - run: flutter create --platforms android --project-name buslin_keygen .

      # keystore tetap (upload di ROOT repo ini juga)
      - run: cp buslin-keystore.p12 android/app/buslin-keystore.p12

      - run: |
          cat > android/key.properties << 'EOF'
          storePassword=buslin2026
          keyPassword=buslin2026
          keyAlias=buslin
          storeFile=buslin-keystore.p12
          EOF

      - name: ProGuard rules
        run: |
          cat > android/app/proguard-rules.pro << 'EOF'
          -keep class io.flutter.** { *; }
          -dontwarn io.flutter.embedding.**
          EOF

      - run: flutter pub get

      - run: flutter build apk --release --obfuscate --split-debug-info=symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buslin-keygen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
